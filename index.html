 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
// ---- sounds: random dodge on player moves, random power-up sounds, thunder (all play to the end) ----
['dodge3','dodge4','power1','power2','power3','power4','thunder1','thunder2'].forEach(n=>{const a=new Audio('./'+n+'.mp3');a.preload='auto';sound.audio[n]=a});
Object.values(sound.audio).forEach(a=>a.addEventListener('error',()=>{a._bad=true}));sound.applyVol();
sound.rand=function(names){const c=names.filter(n=>this.audio[n]&&!this.audio[n]._bad);return c.length?c[Math.floor(Math.random()*c.length)]:null};
sound.playFull=function(n,fb){const a=this.audio[n];try{const c=a.cloneNode();c.volume=a.volume;const p=c.play();if(p&&p.catch)p.catch(()=>{if(fb)fb()})}catch(e){if(fb)fb()}};
sound.dodge=function(){if(this.muted)return;const n=this.rand(['dodge1','dodge2','dodge3','dodge4']);if(n)this.playFull(n)};
sound.jump=function(){this.dodge()};
sound.power=function(){if(this.muted)return;const fb=()=>{this.tone(330,1320,.28,'triangle');setTimeout(()=>this.chime(),130)},n=this.rand(['power1','power2','power3','power4']);if(n)this.playFull(n,fb);else fb()};
sound.thunder=function(){if(this.muted||!this.ctx)return;const n=this.rand(['thunder1','thunder2']);if(n)this.playFull(n,()=>this.thunderSynth());else this.thunderSynth()};
sound.thunderSynth=function(){try{const c=this.ctx,t=c.currentTime,len=Math.floor(c.sampleRate*3.4),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const mk=(f,type,peak,dec,delay)=>{const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t+delay);if(type==='lowpass')fl.frequency.exponentialRampToValueAtTime(90,t+delay+dec);const g=c.createGain();g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(peak,t+delay+.015);g.gain.exponentialRampToValueAtTime(.001,t+delay+dec);s.connect(fl);fl.connect(g);g.connect(this.dest());s.start(t+delay);s.stop(t+delay+dec+.1)};
 mk(3500,'highpass',.7,.35,0);mk(1200,'lowpass',.9,1.6,.02);mk(260,'lowpass',1,3,.25);mk(180,'lowpass',.7,2.4,1.1)}catch(e){}};
{const _l=Player.prototype.left,_r=Player.prototype.right,_s=Player.prototype.slide;
 Player.prototype.left=function(){const o=this.lane;_l.call(this);if(this.lane!==o)sound.dodge()};
 Player.prototype.right=function(){const o=this.lane;_r.call(this);if(this.lane!==o)sound.dodge()};
 Player.prototype.slide=function(){const w=this.sliding;_s.call(this);if(!w&&this.sliding)sound.dodge()}}
const evs=['pointerdown','touchstart','keydown'],unlockMenu=e=>{if(state!==State.MENU||(e.target&&e.target.closest&&e.target.closest('#start-btn')))return;sound.menuPlay(()=>evs.forEach(t=>removeEventListener(t,unlockMenu)))};
evs.forEach(t=>addEventListener(t,unlockMenu));sound.menuPlay(()=>evs.forEach(t=>removeEventListener(t,unlockMenu)));
resetGame();updateRoad();animate();
